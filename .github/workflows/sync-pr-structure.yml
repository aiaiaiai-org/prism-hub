name: Sync PR structure

on:
  push:
    branches: [feature/hqbase-device-authorization]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILS_ENV: test
      SECRET_KEY_BASE: test-secret-key-base-that-is-not-used-outside-ci
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prism_hub_test
      PRISM_HUB_API_TOKEN: test-hub-token-that-is-longer-than-32-characters
      PRISM_HUB_CHANNELS_JSON: "[]"
      PRISM_RUNTIME_COMMAND_JSON: '["prism-runtime","--json"]'

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: prism_hub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d prism_hub_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/hqbase-device-authorization
          fetch-depth: 0

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --show-error --silent \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          architecture="$(dpkg --print-architecture)"
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://apt.postgresql.org/pub/repos/apt' \
            "Suites: ${VERSION_CODENAME}-pgdg" \
            "Architectures: ${architecture}" \
            'Components: main' \
            'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Generate deterministic structure
        run: bundle exec rails db:prepare

      - name: Commit generated structure when changed
        run: |
          if git diff --quiet -- db/structure.sql; then
            echo "Database structure is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/structure.sql
          git commit -m "Update database structure for mail credentials"
          git push origin HEAD:feature/hqbase-device-authorization
