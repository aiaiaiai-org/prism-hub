name: Validate deploy

on:
  pull_request:
    paths:
      - '.github/workflows/publish.yml'
      - '.github/workflows/image.yml'
      - 'Dockerfile'
      - '.github/workflows/verify-hua-delivery.yml'
      - 'script/check-hua-delivery-handshake.sh'
      - 'script/test-hua-delivery-handshake.sh'
      - '.github/workflows/validate-deploy.yml'
      - '.github/workflows/full-ci.yml'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'config/database.yml'
      - 'config/environments/production.rb'
      - 'config/puma.rb'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production:
    name: Production deploy contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate publish contract
        shell: bash
        run: |
          set -Eeuo pipefail

          ruby -ryaml <<'RUBY'
          publish = File.read('.github/workflows/publish.yml', encoding: 'UTF-8')
          image = File.read('.github/workflows/image.yml', encoding: 'UTF-8')

          # infra's prism-hub contract verifies provenance from exactly this signer workflow,
          # for refs/heads/master and the commit the image is tagged with.
          # Actions expands an expression marker anywhere in a run script, so it is assembled here.
          expr = ->(inner) { '$' + '{{ ' + inner + ' }}' }
          required = [
            'workflows: [Full CI]',
            'branches: [master]',
            "github.event.workflow_run.conclusion == 'success'",
            '.path == ".github/workflows/full-ci.yml"',
            'git rev-parse origin/master',
            '"$sha" != "$GITHUB_SHA"',
            "tags: ghcr.io/#{expr['github.repository']}:#{expr['steps.source.outputs.sha']}",
            'actions/attest-build-provenance@',
            "subject-name: ghcr.io/#{expr['github.repository']}",
            "subject-digest: #{expr['steps.build.outputs.digest']}",
            'push-to-registry: true',
            'id-token: write',
            'attestations: write',
            'packages: write',
            # Runtime secrets leave this repository only sealed to the target's public key.
            'environment: production',
            'https://github.com/aiaiaiai-org/infra.git',
            'encryptionRecipient',
            'age --recipient "$RECIPIENT"',
            "tags: ghcr.io/#{expr['github.repository']}:#{expr['steps.source.outputs.sha']}.secrets",
            "subject-digest: #{expr['steps.envelope.outputs.digest']}",
          ]
          missing = required.reject { |fragment| publish.include?(fragment) }
          abort "publish workflow is missing: #{missing.join(', ')}" unless missing.empty?

          # The producer holds no credential for infra and never deploys.
          workflows = Dir['.github/workflows/*.yml'].to_h { |path| [path, File.read(path, encoding: 'UTF-8')] }
          workflows.each do |path, text|
            abort "#{path}: infra credential is obsolete" if text.include?('INFRA_DEPLOY' + '_TOKEN')
            abort "#{path}: infra is not dispatched; it pulls" if text.include?('aiaiaiai-org/infra/' + 'dispatches')
            abort "#{path}: repository SSH credentials do not belong here" if text.match?(/secrets\.SSH_(HOST|USER|PRIVATE_KEY|KNOWN_HOSTS)/)
          end
          # Psych reads the bare `on` key as true.
          triggers = YAML.safe_load(publish).then { |doc| doc[true] || doc['on'] }
          abort 'publish workflow must start only from Full CI' unless triggers.is_a?(Hash) && triggers.keys == ['workflow_run']
          abort 'plaintext secrets must not be uploaded' if publish.include?('upload-artifact')
          abort 'Image must only prove the build' if image.match?(/^\s+push:\s*$/) || image.include?('push: true')
          abort 'Image must not write packages' if image.include?('packages: write')
          RUBY

      - name: Validate producer-owned h-ua handshake
        shell: bash
        run: |
          set -Eeuo pipefail
          ruby <<'RUBY'
          workflow = File.read('.github/workflows/verify-hua-delivery.yml')
          script = File.read('script/check-hua-delivery-handshake.sh')
          abort 'Production environment secret missing' unless workflow.include?('environment: production') &&
            workflow.include?('secrets.PRISM_BOT_DELIVERY_SECRET')
          abort 'Handshake must be manually triggered' unless workflow.include?('workflow_dispatch:')
          abort 'Handshake may not send Telegram messages' unless script.include?("--data-binary '{}'") &&
            script.include?('invalid_request') && !script.include?('--data-binary "@')
          abort 'Handshake must be a safe isolated boundary' if workflow.match?(/^\s+push:\s*$/)
          RUBY
          bash -n script/check-hua-delivery-handshake.sh
          bash -n script/test-hua-delivery-handshake.sh
          bash script/test-hua-delivery-handshake.sh

      - name: Validate production runtime configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'url: <%= ENV["DATABASE_URL"] %>' config/database.yml >/dev/null
          grep -F 'port ENV.fetch("PORT", 3000)' config/puma.rb >/dev/null
          grep -F 'config.force_ssl = ENV.fetch("RAILS_FORCE_SSL", "true") == "true"' \
            config/environments/production.rb >/dev/null
