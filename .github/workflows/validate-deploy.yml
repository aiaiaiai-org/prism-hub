name: Validate deploy

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-production.yml'
      - '.github/workflows/validate-deploy.yml'
      - '.github/workflows/full-ci.yml'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'config/database.yml'
      - 'config/environments/production.rb'
      - 'config/puma.rb'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production:
    name: Production deploy contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate workflow contract
        shell: bash
        run: |
          set -Eeuo pipefail

          ruby <<'RUBY'
          deploy = File.read('.github/workflows/deploy-production.yml')
          validate = File.read('.github/workflows/validate-deploy.yml')

          required = [
            'workflow_dispatch:',
            'inputs:',
            'environment: production',
            'contents: read',
            'secrets.INFRA_DEPLOY_TOKEN',
            'https://api.github.com/repos/aiaiaiai-org/infra/dispatches',
            '"event_type": "deploy-workload"',
            '"workload": "prism-hub"',
            '"ref": os.environ["RELEASE_REF"]',
            'aiaiaiai-org/infra',
          ]
          missing = required.reject { |fragment| deploy.include?(fragment) }
          abort "deploy workflow is missing: #{missing.join(', ')}" unless missing.empty?

          abort 'deploy workflow must not deploy on push' if deploy.match?(/^\s+push:\s*$/)
          abort 'deploy workflow must not contain repository SSH credentials' if deploy.match?(/secrets\.SSH_(HOST|USER|PRIVATE_KEY|KNOWN_HOSTS)/)
          abort 'deploy workflow must not disable SSH host verification' if deploy.include?('StrictHostKeyChecking=no')
          abort 'validate workflow must not encode obsolete SSH deployment assumptions' if validate.include?('secrets.' + 'SSH_')

          abort 'deploy workflow must delegate target resolution to infra' unless deploy.include?('target, SSH credentials, deployment path and service')
          RUBY

      - name: Validate production runtime configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'url: <%= ENV["DATABASE_URL"] %>' config/database.yml >/dev/null
          grep -F 'port ENV.fetch("PORT", 3000)' config/puma.rb >/dev/null
          grep -F 'config.force_ssl = ENV.fetch("RAILS_FORCE_SSL", "true") == "true"' \
            config/environments/production.rb >/dev/null
