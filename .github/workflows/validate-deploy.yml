name: Validate deploy

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-production.yml'
      - '.github/workflows/deploy-postgres.yml'
      - 'script/fetch-infra-recipient.sh'
      - 'script/test-fetch-infra-recipient.sh'
      - '.github/workflows/verify-hua-delivery.yml'
      - 'script/check-hua-delivery-handshake.sh'
      - 'script/test-hua-delivery-handshake.sh'
      - '.github/workflows/validate-deploy.yml'
      - '.github/workflows/full-ci.yml'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'config/database.yml'
      - 'config/environments/production.rb'
      - 'config/puma.rb'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production:
    name: Production deploy contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate workflow contract
        shell: bash
        run: |
          set -Eeuo pipefail

          ruby <<'RUBY'
          deploy = File.read('.github/workflows/deploy-production.yml')
          validate = File.read('.github/workflows/validate-deploy.yml')
          postgres = File.read('.github/workflows/deploy-postgres.yml')
          recipient = File.read('script/fetch-infra-recipient.sh')

          required = [
            'workflow_dispatch:',
            'inputs:',
            'environment: production',
            'contents: read',
            'secrets.INFRA_DEPLOY_TOKEN',
            'https://api.github.com/repos/aiaiaiai-org/infra/dispatches',
            '"event_type": "deploy-workload"',
            '"workload": "prism-hub"',
            '"image": os.environ["RELEASE_IMAGE"]',
            'ghcr.io/${GITHUB_REPOSITORY,,}:${sha}',
            'packages: read',
            'aiaiaiai-org/infra',
          ]
          missing = required.reject { |fragment| deploy.include?(fragment) }
          abort "deploy workflow is missing: #{missing.join(', ')}" unless missing.empty?

          abort 'deploy workflow must not deploy on push' if deploy.match?(/^\s+push:\s*$/)
          abort 'deploy workflow must not contain repository SSH credentials' if deploy.match?(/secrets\.SSH_(HOST|USER|PRIVATE_KEY|KNOWN_HOSTS)/)
          abort 'deploy workflow must not disable SSH host verification' if deploy.include?('StrictHostKeyChecking=no')
          abort 'validate workflow must not encode obsolete SSH deployment assumptions' if validate.include?('secrets.' + 'SSH_')

          {'prism-hub' => deploy, 'prism-postgres' => postgres}.each do |workload, workflow|
            abort "Static recipient variable still used for #{workload}" if workflow.include?('vars.INFRA_AGE_RECIPIENT')
            abort "Missing recipient request for #{workload}" unless workflow.include?('bash script/fetch-infra-recipient.sh ' + workload)
            abort "Missing recipient output for #{workload}" unless workflow.include?('steps.recipient.outputs.key')
            abort "Missing restricted INFRA_DEPLOY_TOKEN for #{workload}" unless workflow.include?('secrets.INFRA_DEPLOY_TOKEN')
            abort "Deployment must remain manual: #{workload}" unless workflow.include?('workflow_dispatch:')
            abort "Secret-containing workflow must not deploy on push: #{workload}" if workflow.match?(/^\s+push:\s*$/)
          end
          abort 'Recipient script must use correlated infra workflow' unless recipient.include?('issue-workload-recipient.yml') && recipient.include?('recipient-')
          abort 'Recipient script must not request private SSH material' if recipient.include?('SSH_PRIVATE_KEY')
          abort 'Recipient script must not forward GHCR credentials' if recipient.include?('GHCR_PULL_TOKEN')

          abort 'deploy workflow must delegate target resolution to infra' unless deploy.include?('target, network, secrets and activation: resolved by `aiaiaiai-org/infra`')
          # prism-hub is a container workload: infra deploys an image, and the caller names no ref.
          abort 'deploy workflow must dispatch an image, not a ref' if deploy.include?('"ref": os.environ')
          RUBY

      - name: Check encryption recipient script syntax
        run: bash -n script/fetch-infra-recipient.sh

      - name: Test recipient retry and public-key output safety
        shell: bash
        run: bash script/test-fetch-infra-recipient.sh

      - name: Validate producer-owned h-ua handshake
        shell: bash
        run: |
          set -Eeuo pipefail
          ruby <<'RUBY'
          workflow = File.read('.github/workflows/verify-hua-delivery.yml')
          script = File.read('script/check-hua-delivery-handshake.sh')
          abort 'Production environment secret missing' unless workflow.include?('environment: production') &&
            workflow.include?('secrets.PRISM_BOT_DELIVERY_SECRET')
          abort 'Handshake must be manually triggered' unless workflow.include?('workflow_dispatch:')
          abort 'Handshake may not send Telegram messages' unless script.include?("--data-binary '{}'") &&
            script.include?('invalid_request') && !script.include?('--data-binary "@')
          abort 'Handshake must be a safe isolated boundary' if workflow.match?(/^\s+push:\s*$/)
          RUBY
          bash -n script/check-hua-delivery-handshake.sh
          bash -n script/test-hua-delivery-handshake.sh
          bash script/test-hua-delivery-handshake.sh

      - name: Validate production runtime configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'url: <%= ENV["DATABASE_URL"] %>' config/database.yml >/dev/null
          grep -F 'port ENV.fetch("PORT", 3000)' config/puma.rb >/dev/null
          grep -F 'config.force_ssl = ENV.fetch("RAILS_FORCE_SSL", "true") == "true"' \
            config/environments/production.rb >/dev/null
