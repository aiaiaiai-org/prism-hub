name: Deploy production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: master
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: prism-hub-production
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch production deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production

    steps:
      - name: Resolve the release image
        id: release
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          ref="${RELEASE_REF:-master}"
          if [[ -z "$ref" || "$ref" == -* || "$ref" == *' '* ]]; then
            echo "ref must be a non-empty Git ref without leading '-' or spaces" >&2
            exit 64
          fi

          # The image is named by the commit it was built from, so a branch or tag is resolved to
          # that commit first. Only a commit that reached master has a published image.
          # An annotated tag points at a tag object; its peeled line (^{}) names the commit.
          lines="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/heads/${ref}" "refs/tags/${ref}" "refs/tags/${ref}^{}")"
          sha="$(awk '$2 ~ /\^\{\}$/ {print $1; exit}' <<< "$lines")"
          [[ -n "$sha" ]] || sha="$(awk 'NR == 1 {print $1}' <<< "$lines")"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "requested ref does not exist: ${ref}" >&2
            exit 64
          fi

          image="ghcr.io/${GITHUB_REPOSITORY,,}:${sha}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          if ! docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "no published image for ${ref} (${sha}); the Image workflow publishes one when a commit reaches master" >&2
            exit 65
          fi

          echo "ref=$ref" >>"$GITHUB_OUTPUT"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "image=$image" >>"$GITHUB_OUTPUT"

      - name: Encrypt Prism Hub credentials for its target Environment
        env:
          PRISM_POSTGRES_PASSWORD: ${{ secrets.PRISM_POSTGRES_PASSWORD }}
          PRISM_HUB_SECRET_KEY_BASE: ${{ secrets.PRISM_HUB_SECRET_KEY_BASE }}
          INFRA_AGE_RECIPIENT: ${{ vars.INFRA_AGE_RECIPIENT }}
          REGISTRY_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$PRISM_POSTGRES_PASSWORD"
          test -n "$PRISM_HUB_SECRET_KEY_BASE"
          test -n "$INFRA_AGE_RECIPIENT"
          for name in PRISM_POSTGRES_PASSWORD PRISM_HUB_SECRET_KEY_BASE; do
            [[ "${!name}" != *$'\n'* && "${!name}" != *$'\r'* ]] || exit 1
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          {
            printf 'PRISM_POSTGRES_PASSWORD=%s\n' "$PRISM_POSTGRES_PASSWORD"
            printf 'PRISM_HUB_SECRET_KEY_BASE=%s\n' "$PRISM_HUB_SECRET_KEY_BASE"
            printf 'GHCR_PULL_USER=%s\n' "$GITHUB_ACTOR"
            printf 'GHCR_PULL_TOKEN=%s\n' "$REGISTRY_TOKEN"
          } > "$RUNNER_TEMP/prism-hub-source.env"
          age --armor --recipient "$INFRA_AGE_RECIPIENT" \
            --output "$RUNNER_TEMP/prism-hub-secret.age" "$RUNNER_TEMP/prism-hub-source.env"
          rm -f "$RUNNER_TEMP/prism-hub-source.env"

      - name: Dispatch to aiaiaiai infra
        env:
          INFRA_DEPLOY_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_REF: ${{ steps.release.outputs.ref }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -s "$RUNNER_TEMP/prism-hub-secret.age" ]]; then
            echo "Encrypted Prism Hub credentials are missing" >&2
            exit 78
          fi
          ENCRYPTED_SECRETS="$(cat "$RUNNER_TEMP/prism-hub-secret.age")"
          export ENCRYPTED_SECRETS
          if [[ -z "${INFRA_DEPLOY_TOKEN:-}" ]]; then
            echo "INFRA_DEPLOY_TOKEN is required in the production Environment" >&2
            exit 78
          fi

          payload="$(python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              "event_type": "deploy-workload",
              "client_payload": {
                  "workload": "prism-hub",
                  "image": os.environ["RELEASE_IMAGE"],
                  "source_repository": os.environ["GITHUB_REPOSITORY"],
                  "secrets_age": os.environ["ENCRYPTED_SECRETS"],
              },
          }))
          PY
          )"

          curl --fail --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/aiaiaiai-org/infra/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${INFRA_DEPLOY_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$payload"

          rm -f "$RUNNER_TEMP/prism-hub-secret.age"

          {
            echo '### Prism Hub production deployment'
            echo
            echo '- infra workload: `prism-hub`'
            echo "- release: \`${RELEASE_REF}\` at \`${RELEASE_SHA}\`"
            echo "- image: \`${RELEASE_IMAGE}\`"
            echo '- target, network, secrets and activation: resolved by `aiaiaiai-org/infra`'
          } >>"$GITHUB_STEP_SUMMARY"
