name: Deploy production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: prism-hub-production
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch production deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production

    steps:
      - name: Validate deployment ref
        id: ref
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          set -Eeuo pipefail

          ref="${RELEASE_REF:-master}"
          if [[ -z "$ref" || "$ref" == -* || "$ref" == *' '* ]]; then
            echo "ref must be a non-empty Git ref without leading '-' or spaces" >&2
            exit 64
          fi

          if ! git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/heads/${ref}" "refs/tags/${ref}" >/dev/null 2>&1; then
            echo "requested ref does not exist: ${ref}" >&2
            exit 64
          fi

          echo "release_ref=$ref" >>"$GITHUB_OUTPUT"

      - name: Dispatch to aiaiaiai infra
        env:
          INFRA_DEPLOY_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
          RELEASE_REF: ${{ steps.ref.outputs.release_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${INFRA_DEPLOY_TOKEN:-}" ]]; then
            echo "INFRA_DEPLOY_TOKEN is required in the production Environment" >&2
            exit 78
          fi

          payload="$(python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              "event_type": "deploy-workload",
              "client_payload": {
                  "workload": "prism-hub",
                  "ref": os.environ["RELEASE_REF"],
              },
          }))
          PY
          )"

          curl --fail --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/aiaiaiai-org/infra/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${INFRA_DEPLOY_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$payload"

          {
            echo '### Prism Hub production deployment'
            echo
            echo "- infra workload: `prism-hub`"
            echo "- release ref: `${RELEASE_REF}`"
            echo "- target, SSH credentials, deployment path and service: resolved by `aiaiaiai-org/infra`"
            echo "- activation: delegated to the infra workload contract"
          } >>"$GITHUB_STEP_SUMMARY"
