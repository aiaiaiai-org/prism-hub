openapi: 3.1.0
info:
  title: Prism Hub API
  version: 0.1.0-alpha.4
  summary: Versioned client boundary for Prism control-plane operations
  description: >-
    Clients authenticate with workspace-bound opaque Hub credentials and use
    public Hub channel IDs. Provider channel and credential references remain
    server-side and are expanded only before invoking prism-execution.v1.
servers:
  - url: http://localhost:3000
security:
  - BearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check process liveness
      security: []
      responses:
        "200":
          description: Process is running
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/channels:
    get:
      operationId: listChannels
      summary: List channels visible to the authenticated principal
      description: >-
        Requires channels:read and returns only stable public channel IDs granted
        to the authenticated service principal. Continue with the opaque
        next_cursor until it is null.
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: Authorised public channel metadata
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InputRejected"
  /api/v1/actors/resolve:
    post:
      operationId: resolveActor
      summary: Resolve provider evidence into a workspace human actor
      description: >-
        Requires actors:resolve. The provider subject is resolved only inside the
        authenticated principal's workspace. Unknown, revoked, disabled, or
        unbound actor states intentionally return the same forbidden response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActorResolutionRequest"
            examples:
              telegram:
                summary: Telegram numeric user ID as an opaque provider subject
                value:
                  provider: telegram
                  provider_scope: global
                  subject_id: "123456789"
      responses:
        "200":
          description: Canonical human actor authorized for the workspace
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorResolutionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /api/v1/publications/validate:
    post:
      operationId: validatePublication
      summary: Run deterministic preflight without publishing
      description: >-
        Requires publications:validate and a channel grant for every explicit
        target. If any target is outside the principal scope, the entire request
        is rejected before Prism execution.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationRequest"
      responses:
        "200":
          $ref: "#/components/responses/ExecutionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ExecutionResponse"
        "502":
          $ref: "#/components/responses/ExecutionResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/publications:
    post:
      operationId: publishPublication
      summary: Publish one explicit multi-target request
      description: >-
        Requires publications:publish and a channel grant for every explicit
        target. Authorization is all-or-nothing: ungranted targets are never
        silently dropped. This operation may perform irreversible external
        actions; dispatch behavior is controlled by the request's explicit
        dispatch_policy.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationRequest"
            examples:
              multiTarget:
                summary: Provider-neutral post and story variants
                value:
                  dispatch_policy: require_all_valid
                  variants:
                    - id: personal-post
                      locale: uk-UA
                      voice_profile: 0x0sky.uk_SP
                      format: post
                      body:
                        text: привіт із Prism
                      provenance:
                        kind: human
                    - id: personal-story
                      locale: uk-UA
                      voice_profile: 0x0sky.uk_SP
                      format: story
                      body:
                        media:
                          - ref: media-cover-1
                            kind: image
                            mime_type: image/webp
                            alt_text: Фіолетове світло Prism
                      provenance:
                        kind: human
                  targets:
                    - id: threads-post
                      channel_id: personal-threads
                      selection:
                        mode: exact
                        variant_id: personal-post
                    - id: instagram-story
                      channel_id: personal-instagram-story
                      selection:
                        mode: exact
                        variant_id: personal-story
      responses:
        "200":
          $ref: "#/components/responses/ExecutionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ExecutionResponse"
        "502":
          $ref: "#/components/responses/ExecutionResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  headers:
    RequestId:
      description: Server-generated correlation ID for this HTTP request
      schema:
        $ref: "#/components/schemas/StableReference"
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: prism_client_v1 opaque credential
      description: >-
        Workspace-bound Hub credential. Missing, malformed, expired, or revoked
        credentials are unauthenticated. The legacy global token is accepted only
        when an explicit server-side migration flag enables it.
  parameters:
    PageLimit:
      name: limit
      in: query
      required: false
      description: Maximum channels to return
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    PageCursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation cursor from the previous authorised page
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable key for one logical multi-target publication
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: "^[!-~]+$"
  responses:
    ExecutionResponse:
      description: Prism execution envelope or typed execution rejection
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperationResponse"
    BadRequest:
      description: Malformed JSON or invalid request shape
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing, malformed, expired, revoked, or otherwise invalid Hub bearer credential
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: >-
        Authenticated principal lacks the required capability or channel grant,
        or the requested human actor is not authorized for the principal's workspace
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Request exceeded the configured body limit
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: Content-Type is not application/json
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Prism execution boundary is unavailable
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InputRejected:
      description: Query or domain input was rejected with a typed error
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    StableReference:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          const: ok
        service:
          const: prism-hub
    Channel:
      type: object
      additionalProperties: false
      required: [id, label, provider_id, capabilities]
      properties:
        id:
          $ref: "#/components/schemas/StableReference"
        label:
          type: string
          minLength: 1
          maxLength: 120
        provider_id:
          type: string
        capabilities:
          $ref: "#/components/schemas/ChannelCapabilities"
    ChannelCapabilities:
      type: object
      additionalProperties: false
      required: [formats, text, media_kinds]
      properties:
        formats:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [post, story, short_video, poll]
        text:
          type: boolean
        media_kinds:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [image, video, audio, document]
      anyOf:
        - properties:
            text:
              const: true
        - properties:
            media_kinds:
              minItems: 1
    PageInfo:
      type: object
      additionalProperties: false
      required: [limit, next_cursor]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        next_cursor:
          type: [string, "null"]
    ChannelsResponse:
      type: object
      additionalProperties: false
      required: [channels, page]
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
        page:
          $ref: "#/components/schemas/PageInfo"
    ActorResolutionRequest:
      type: object
      additionalProperties: false
      required: [provider, provider_scope, subject_id]
      properties:
        provider:
          type: string
          pattern: "^[a-z][a-z0-9._-]{0,63}$"
        provider_scope:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
        subject_id:
          type: string
          minLength: 1
          maxLength: 512
    CanonicalIdentity:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: person
        id:
          type: string
          minLength: 1
          maxLength: 255
    ResolvedActor:
      type: object
      additionalProperties: false
      required: [identity, role]
      properties:
        identity:
          $ref: "#/components/schemas/CanonicalIdentity"
        role:
          type: string
          enum: [owner, admin, member]
    ActorResolutionResponse:
      type: object
      additionalProperties: false
      required: [actor]
      properties:
        actor:
          $ref: "#/components/schemas/ResolvedActor"
    PublicationRequest:
      type: object
      additionalProperties: false
      required: [variants, targets]
      properties:
        dispatch_policy:
          type: string
          enum: [require_all_valid, independent]
          default: require_all_valid
        variants:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ContentVariant"
        targets:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PublicationTarget"
    ContentVariant:
      type: object
      additionalProperties: false
      required: [id, locale, format, body, provenance]
      properties:
        id:
          $ref: "#/components/schemas/StableReference"
        locale:
          type: string
          minLength: 2
          description: BCP-47 content locale
        voice_profile:
          $ref: "#/components/schemas/StableReference"
        audience:
          $ref: "#/components/schemas/Audience"
        format:
          type: string
          enum: [post, story, short_video, poll]
        body:
          $ref: "#/components/schemas/ContentBody"
        provenance:
          $ref: "#/components/schemas/Provenance"
    Audience:
      type: object
      additionalProperties: false
      properties:
        country:
          type: string
          pattern: "^[A-Z]{2}$"
        region:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        segment:
          type: string
          minLength: 1
    ContentBody:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
        media:
          type: array
          items:
            $ref: "#/components/schemas/Media"
      anyOf:
        - required: [text]
        - required: [media]
    Media:
      type: object
      additionalProperties: false
      required: [ref, kind]
      properties:
        ref:
          $ref: "#/components/schemas/StableReference"
        kind:
          type: string
          enum: [image, video, audio, document]
        mime_type:
          type: string
        alt_text:
          type: string
    Provenance:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [human, import, deterministic_transform, ai]
        producer:
          type: string
        source_refs:
          type: array
          items:
            type: string
    PublicationTarget:
      type: object
      additionalProperties: false
      required: [id, channel_id, selection]
      properties:
        id:
          $ref: "#/components/schemas/StableReference"
        channel_id:
          $ref: "#/components/schemas/StableReference"
        selection:
          oneOf:
            - $ref: "#/components/schemas/ExactSelection"
            - $ref: "#/components/schemas/OrderedSelection"
    ExactSelection:
      type: object
      additionalProperties: false
      required: [mode, variant_id]
      properties:
        mode:
          const: exact
        variant_id:
          $ref: "#/components/schemas/StableReference"
    OrderedSelection:
      type: object
      additionalProperties: false
      required: [mode, variant_ids]
      properties:
        mode:
          const: ordered
        variant_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/StableReference"
    ExecutionResponse:
      type: object
      required: [protocol_version, request_id, status]
      properties:
        protocol_version:
          const: prism-execution.v1
        request_id:
          type: string
        status:
          type: string
          enum: [ok, error]
        result:
          type: object
          additionalProperties: true
        error:
          $ref: "#/components/schemas/Error"
    OperationResponse:
      oneOf:
        - $ref: "#/components/schemas/ExecutionResponse"
        - $ref: "#/components/schemas/ErrorResponse"
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [status, request_id, error]
      properties:
        status:
          const: error
        request_id:
          $ref: "#/components/schemas/StableReference"
        error:
          $ref: "#/components/schemas/Error"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        issues:
          type: array
          items:
            type: object
            additionalProperties: true
